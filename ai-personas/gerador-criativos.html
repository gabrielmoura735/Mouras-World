<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Criativos</title>
<style>
  :root{
    --bg:#0E1116;
    --panel:#161B22;
    --panel-2:#1D2430;
    --line:#2A3240;
    --ink:#EDEFF3;
    --ink-dim:#9AA4B2;
    --accent:#FFB020;
    --accent-2:#3DDC97;
    --font-display:'Georgia', 'Times New Roman', serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); padding:32px 20px 80px;
  }
  .wrap{max-width:820px; margin:0 auto;}
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--accent); margin-bottom:8px;
  }
  h1{
    font-family:var(--font-display); font-size:clamp(28px,5vw,40px);
    margin:0 0 6px; font-weight:700; line-height:1.1;
  }
  .sub{color:var(--ink-dim); font-size:14.5px; margin:0 0 32px; max-width:520px;}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:22px; margin-bottom:20px;
  }
  label{
    display:block; font-size:12px; color:var(--ink-dim); margin-bottom:6px;
    font-family:var(--font-mono); letter-spacing:.03em;
  }
  .row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  @media(max-width:560px){.row{grid-template-columns:1fr;}}
  input, select, textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line);
    color:var(--ink); border-radius:8px; padding:11px 12px; font-size:14.5px;
    font-family:var(--font-body); outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical; min-height:60px;}
  .field{margin-bottom:14px;}
  button{
    width:100%; background:var(--accent); color:#1A1300; border:none;
    padding:14px; border-radius:9px; font-weight:700; font-size:15px;
    cursor:pointer; font-family:var(--font-body); margin-top:4px;
    transition:filter .15s;
  }
  button:hover{filter:brightness(1.08);}
  button:disabled{opacity:.5; cursor:wait;}
  .results{display:flex; flex-direction:column; gap:16px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:20px; position:relative;
  }
  .card .tag{
    display:inline-block; font-family:var(--font-mono); font-size:10px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--accent-2);
    border:1px solid var(--accent-2); border-radius:20px; padding:2px 10px;
    margin-bottom:12px;
  }
  .headline{font-family:var(--font-display); font-size:20px; margin:0 0 8px; line-height:1.3;}
  .legenda{font-size:14px; color:var(--ink); line-height:1.55; margin:0 0 12px; white-space:pre-wrap;}
  .cta{
    display:inline-block; background:var(--accent-2); color:#04241A;
    font-weight:700; font-size:13px; padding:7px 14px; border-radius:7px;
    margin-bottom:14px;
  }
  .imgprompt{
    background:var(--panel-2); border:1px dashed var(--line); border-radius:9px;
    padding:12px; font-family:var(--font-mono); font-size:12.5px;
    color:var(--ink-dim); line-height:1.5; position:relative;
  }
  .imgprompt-label{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-dim); margin-bottom:6px; display:block;
  }
  .top-tag{
    display:inline-block; font-family:var(--font-mono); font-size:10px;
    letter-spacing:.1em; text-transform:uppercase; color:#1A1300;
    background:var(--accent); border-radius:20px; padding:2px 10px;
    margin-left:8px; vertical-align:middle;
  }
  .card.top{border-color:var(--accent);}
  .porque{
    font-size:12.5px; color:var(--ink-dim); border-left:2px solid var(--accent-2);
    padding-left:10px; margin:0 0 14px; font-style:italic; line-height:1.5;
  }
  .score{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-dim);
    float:right;
  }
  .copybtn{
    position:absolute; top:10px; right:10px; background:none; border:1px solid var(--line);
    color:var(--ink-dim); font-size:11px; padding:4px 9px; width:auto; margin:0;
    border-radius:6px; font-family:var(--font-mono);
  }
  .copybtn:hover{color:var(--ink); border-color:var(--ink-dim); filter:none;}
  .state{color:var(--ink-dim); font-size:13.5px; text-align:center; padding:24px 0;}
  .err{color:#FF6B6B; font-size:13.5px; margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Ferramenta interna · Criativos</div>
  <h1>Gerador de Criativos</h1>
  <p class="sub">Preenche o produto e o público. Sai headline, legenda, CTA e o prompt de imagem pronto — pra qualquer nicho, sem pagar designer.</p>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label>Produto / oferta</label>
        <input id="produto" placeholder="Ex: fone bluetooth com cancelamento de ruído">
      </div>
      <div class="field">
        <label>Nicho / categoria</label>
        <input id="nicho" placeholder="Ex: eletrônicos, salgados, digital...">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Público-alvo</label>
        <input id="publico" placeholder="Ex: jovens que trabalham home office">
      </div>
      <div class="field">
        <label>Objetivo</label>
        <select id="objetivo">
          <option>Vender direto (CTA forte)</option>
          <option>Gerar desejo / demanda alta</option>
          <option>Engajar antes de vender</option>
          <option>Urgência / promoção limitada</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Tom (opcional)</label>
      <input id="tom" placeholder="Ex: descontraído, premium, urgente...">
    </div>
    <button id="gerar">Gerar 15 criativos</button>
    <div id="err" class="err"></div>
  </div>

  <div id="results" class="results"></div>
</div>

<script>
const btn = document.getElementById('gerar');
const resultsEl = document.getElementById('results');
const errEl = document.getElementById('err');

btn.addEventListener('click', gerar);

async function gerar(){
  const produto = document.getElementById('produto').value.trim();
  const nicho = document.getElementById('nicho').value.trim();
  const publico = document.getElementById('publico').value.trim();
  const objetivo = document.getElementById('objetivo').value;
  const tom = document.getElementById('tom').value.trim();

  errEl.textContent = '';
  if(!produto){
    errEl.textContent = 'Preenche pelo menos o produto/oferta.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Gerando 15...';
  resultsEl.innerHTML = '<div class="state">Analisando o produto e montando 15 ângulos diferentes...</div>';

  const frameworks = [
    'AIDA (atenção-interesse-desejo-ação)', 'PAS (problema-agitação-solução)',
    'prova social / depoimento simulado', 'urgência e escassez', 'curiosidade / loop aberto',
    'benefício direto e cru', 'storytelling pessoal', 'comparação antes/depois',
    'humor leve', 'autoridade / especialista', 'medo de ficar de fora (FOMO)',
    'pergunta retórica provocadora', 'estilo bastidores/making-of', 'oferta/preço em destaque',
    'identificação com a dor do público'
  ];

  const prompt = `Você é um estrategista sênior de marketing digital e copywriter de performance, com anos rodando campanhas de tráfego pago e orgânico no Brasil. Você conhece a fundo o que converte em cada nicho e não escreve texto genérico — cada linha tem intenção estratégica.

Produto/oferta: ${produto}
Nicho: ${nicho || 'não especificado, infira pelo produto'}
Público-alvo: ${publico || 'infira pelo produto e nicho'}
Objetivo da campanha: ${objetivo}
Tom: ${tom || 'infira o mais adequado ao público e objetivo'}

Antes de escrever, pense (internamente, não escreva isso na resposta) em quem é esse público, o que ele teme, o que ele deseja, e o que faria ele parar de rolar o feed.

Gere EXATAMENTE 15 criativos de anúncio, cada um usando um framework de persuasão DIFERENTE desta lista (use todos, um por criativo): ${frameworks.join(' | ')}.

Para cada criativo, avalie você mesmo a força esperada dele (nota de 1 a 10, sendo honesto e criterioso, não dê nota alta pra tudo) e explique em uma frase curta por que ele funcionaria para ESSE público específico.

Responda APENAS em JSON válido, sem markdown, sem texto fora do JSON, no formato:
{
  "criativos": [
    {
      "framework": "nome do framework usado",
      "headline": "string curta e forte, até 8 palavras",
      "legenda": "legenda pronta pra postar, 2-4 frases, em português informal do Brasil, natural, sem parecer robótico",
      "cta": "texto do botão/CTA, até 5 palavras",
      "prompt_imagem": "prompt detalhado em inglês para gerador de imagem IA, descrevendo cena, produto, iluminação, estilo, enquadramento",
      "nota": 8,
      "porque_funciona": "uma frase curta e específica, não genérica"
    }
  ]
}`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 8000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    const textBlock = data.content.find(c => c.type === 'text');
    let raw = textBlock ? textBlock.text : '';
    raw = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    let criativos = parsed.criativos || [];
    criativos.sort((a,b) => (b.nota||0) - (a.nota||0));
    render(criativos);
  }catch(e){
    console.error(e);
    resultsEl.innerHTML = '';
    errEl.textContent = 'Deu erro ao gerar (às vezes a resposta vem grande demais — tenta de novo).';
  }finally{
    btn.disabled = false;
    btn.textContent = 'Gerar 15 criativos';
  }
}

function render(criativos){
  if(!criativos.length){
    resultsEl.innerHTML = '<div class="state">Nada gerado, tenta de novo.</div>';
    return;
  }
  resultsEl.innerHTML = criativos.map((c, i) => `
    <div class="card ${i < 3 ? 'top' : ''}">
      <span class="score">nota ${c.nota ?? '–'}/10</span>
      <span class="tag">${escapeHtml(c.framework || ('Variação ' + (i+1)))}</span>
      ${i < 3 ? '<span class="top-tag">Recomendado</span>' : ''}
      <p class="headline">${escapeHtml(c.headline || '')}</p>
      <p class="legenda">${escapeHtml(c.legenda || '')}</p>
      <span class="cta">${escapeHtml(c.cta || '')}</span>
      ${c.porque_funciona ? `<p class="porque">${escapeHtml(c.porque_funciona)}</p>` : ''}
      <div class="imgprompt">
        <span class="imgprompt-label">Prompt de imagem (cole numa IA de imagem)</span>
        <button class="copybtn" onclick="copyPrompt(this, ${i})">copiar</button>
        <span id="imgp-${i}">${escapeHtml(c.prompt_imagem || '')}</span>
      </div>
    </div>
  `).join('');
}

function copyPrompt(btnEl, i){
  const text = document.getElementById('imgp-'+i).textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const old = btnEl.textContent;
    btnEl.textContent = 'copiado!';
    setTimeout(()=> btnEl.textContent = old, 1200);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
